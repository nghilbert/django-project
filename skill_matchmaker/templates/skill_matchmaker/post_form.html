{% extends "skill_matchmaker/base.html" %}

{% block title %}{% if object %}Edit post{% else %}New post{% endif %} | Skill Matchmaker{% endblock %}

{% block content %}
    <h1>{% if object %}Edit post{% else %}New post{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form }}
        <button type="submit">{% if object %}Save changes{% else %}Create post{% endif %}</button>
    </form>
{% endblock %}
