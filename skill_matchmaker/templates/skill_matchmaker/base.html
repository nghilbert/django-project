{# Base template for all of the app's pages. #}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}Skill Matchmaker{% endblock %}</title>
    </head>
    <body>
        <nav>
            {% if user.is_authenticated %}
                <a href="{% url 'account_settings' %}">Account</a>
            {% endif %}
        </nav>

        {% block content %}{% endblock %}
    </body>
</html>
